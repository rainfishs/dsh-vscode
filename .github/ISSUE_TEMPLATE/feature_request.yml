name: Feature request
description: Suggest an idea or an improvement for DSH.
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        DSH is intentionally small — it embeds one URL and stays out of the way. Requests that keep it that way are the easiest to accept.

  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the situation, not only the feature you have in mind.
      placeholder: "When I have two windows open and ..."
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What would you like DSH to do?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you have tried
      description: Including other extensions or manual workarounds.
    validations:
      required: false

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I searched the existing issues and this is not a duplicate.
          required: true
