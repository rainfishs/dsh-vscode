name: Bug report
description: Something in DSH does not work as expected.
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. The **DSH** output channel (View ▸ Output ▸ DSH) usually explains what happened — please paste the relevant lines below.

  - type: input
    id: extension-version
    attributes:
      label: DSH version
      description: Extensions view ▸ DSH ▸ the version next to the name.
      placeholder: "0.0.10"
    validations:
      required: true

  - type: input
    id: vscode-version
    attributes:
      label: VS Code version
      description: Help ▸ About.
      placeholder: "1.104.0"
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: Where does VS Code run?
      options:
        - Windows
        - macOS
        - Linux
        - Remote / WSL / Dev Container
        - github.dev / vscode.dev
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Set dsh.urlFile to C:\temp\chat-url.txt
        2. Open the chat panel with Ctrl+Shift+I
        3. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: What happened instead?
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Output channel log
      description: View ▸ Output ▸ DSH.
      render: text
    validations:
      required: false

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I searched the existing issues and this is not a duplicate.
          required: true
        - label: This is not a problem with DeepSeek Harness itself.
          required: true
